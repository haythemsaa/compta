version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: compteo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: compteo_tunisia
      POSTGRES_USER: compteo
      POSTGRES_PASSWORD: compteo_secure_2025
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - compteo-network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: compteo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass compteo_redis_2025
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - compteo-network

  # Laravel Backend (PHP-FPM + Nginx)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: compteo-backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - ./backend/storage:/var/www/storage
      - ./backend/bootstrap/cache:/var/www/bootstrap/cache
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: compteo_tunisia
      DB_USERNAME: compteo
      DB_PASSWORD: compteo_secure_2025
      REDIS_HOST: redis
      REDIS_PASSWORD: compteo_redis_2025
      REDIS_PORT: 6379
    networks:
      - compteo-network

  # Vue.js Frontend (Development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: compteo-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000/api
    networks:
      - compteo-network

  # Mailhog (Email testing)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: compteo-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - compteo-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  compteo-network:
    driver: bridge
